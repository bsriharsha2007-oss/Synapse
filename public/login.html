<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Synapse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <a class="logo" href="/login.html" style="text-decoration: none;">SYNAPSE</a>
    <div class="nav-links"></div>
  </nav>

  <main class="auth-container">
    <section class="card auth-card">
      <div class="auth-brand">Your campus. Your people. Your next big idea.</div>
      <section class="public-stats" aria-label="Live campus project stats">
        <p id="publicStatsStatus" class="public-stats-status" role="status" aria-live="polite">Loading campus activity…</p>
        <div class="public-stats-grid">
          <div><strong id="activeProjectCount">—</strong><span>active projects</span></div>
          <div><strong id="openVacancyCount">—</strong><span>open roles</span></div>
          <div><strong id="completedTeamCount">—</strong><span>complete teams</span></div>
        </div>
      </section>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authDescription" class="project-meta">Sign in with your University ID to find your team.</p>

      <div class="auth-tabs" role="tablist" aria-label="Account options">
        <button type="button" id="loginTab" role="tab" aria-selected="true">Sign in</button>
        <button type="button" id="registerTab" role="tab" aria-selected="false">Create account</button>
      </div>

      <p id="authError" class="auth-error" role="alert" hidden></p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginUniversityId">University ID</label>
          <input id="loginUniversityId" name="university_id" autocomplete="username" required maxlength="64">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required maxlength="128">
        </div>
        <button class="btn-primary auth-submit" type="submit">Sign in</button>
      </form>

      <form id="registerForm" hidden>
        <div class="form-group">
          <label for="registerName">Full name</label>
          <input id="registerName" name="name" autocomplete="name" required maxlength="100">
        </div>
        <div class="form-group">
          <label for="registerEmail">College email</label>
          <input id="registerEmail" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>
        <div class="form-group">
          <label for="registerUniversityId">University ID</label>
          <input id="registerUniversityId" name="university_id" autocomplete="username" required maxlength="64">
        </div>
        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input id="registerPassword" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
        </div>
        <button class="btn-primary auth-submit" type="submit">Create student account</button>
      </form>

      <p class="auth-hint">Student accounts are created with student access. Administrator access is provisioned separately.</p>
    </section>
  </main>

  <script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const errorMessage = document.getElementById('authError');

    fetch('/api/public-stats')
      .then(async response => {
        const stats = await response.json();
        if (!response.ok) throw new Error(stats.error || 'Campus activity is temporarily unavailable.');
        document.getElementById('activeProjectCount').textContent = String(stats.active_project_count);
        document.getElementById('openVacancyCount').textContent = String(stats.open_vacancy_count);
        document.getElementById('completedTeamCount').textContent = String(stats.completed_team_count);
        document.getElementById('publicStatsStatus').textContent = 'Live campus activity';
      })
      .catch(error => {
        document.getElementById('publicStatsStatus').textContent = error.message;
      });

    function setMode(mode) {
      const isLogin = mode === 'login';
      loginForm.hidden = !isLogin;
      registerForm.hidden = isLogin;
      loginTab.setAttribute('aria-selected', String(isLogin));
      registerTab.setAttribute('aria-selected', String(!isLogin));
      document.getElementById('authTitle').textContent = isLogin ? 'Welcome back' : 'Join your campus community';
      document.getElementById('authDescription').textContent = isLogin
        ? 'Sign in with your University ID to find your team.'
        : 'Create a student account to discover projects and meet your next teammates.';
      errorMessage.hidden = true;
      errorMessage.textContent = '';
    }

    loginTab.addEventListener('click', () => setMode('login'));
    registerTab.addEventListener('click', () => setMode('register'));

    async function submitAuthForm(form, endpoint) {
      const submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      errorMessage.hidden = true;
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to continue. Please try again.');

        const next = new URLSearchParams(window.location.search).get('next');
        window.location.assign(window.synapseSafeNext(next));
      } catch (error) {
        errorMessage.textContent = error instanceof TypeError
          ? 'Cannot connect to Synapse. Start the PHP server with “npm start” and try again.'
          : error.message;
        errorMessage.hidden = false;
      } finally {
        submit.disabled = false;
      }
    }

    loginForm.addEventListener('submit', event => {
      event.preventDefault();
      submitAuthForm(loginForm, '/api/auth/login');
    });
    registerForm.addEventListener('submit', event => {
      event.preventDefault();
      submitAuthForm(registerForm, '/api/auth/register');
    });
  </script>
</body>
</html>
